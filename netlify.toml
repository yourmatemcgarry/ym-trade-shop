[build]
  publish   = "public"
  command   = "node scripts/write-config.mjs"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://*.sumup.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://*.sumup.com; frame-src 'self' https://*.sumup.com; form-action 'self' https://*.sumup.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

# Optional: send the old /tradeshop path (if anyone links to it) to the shop root
[[redirects]]
  from = "/tradeshop/*"
  to   = "/:splat"
  status = 301
